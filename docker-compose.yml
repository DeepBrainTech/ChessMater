name: chessmater-production

services:
  game-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chessmater
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: chessmater
    volumes:
      - game-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U chessmater -d chessmater"]
      interval: 5s
      timeout: 3s
      retries: 20

  game-api:
    build:
      context: .
      target: backend-production
    environment:
      NODE_ENV: production
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Set allowed frontend origins in .env}
      PORT: "3000"
      PGHOST: game-db
      PGPORT: "5432"
      PGUSER: chessmater
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGDATABASE: chessmater
      DATABASE_SSL: "false"
      CHESSMATER_JWT_SECRET: ${CHESSMATER_JWT_SECRET:?Set the same CHESSMATER_JWT_SECRET as the main portal}
      CHESSMATER_JWT_ALG: HS256
      CHESSMATER_JWT_AUD: chessmater
      CHESSMATER_JWT_ISS: main-portal
      CHESSMATER_SESSION_JWT_SECRET: ${CHESSMATER_SESSION_JWT_SECRET:?Set an independent session signing secret}
      PORTAL_API_URL: ${PORTAL_API_URL:-https://api.deepbraintechnology.com}
    ports:
      - "127.0.0.1:${CHESSMATER_API_PORT:-3002}:3000"
    restart: unless-stopped
    depends_on:
      game-db:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  game-web:
    build:
      context: .
      target: frontend-production
      args:
        VITE_API_BASE_URL: ${CHESSMATER_API_URL:?Set the public HTTPS URL for the game API}
        VITE_PORTAL_API_BASE_URL: ${PORTAL_API_URL:-https://api.deepbraintechnology.com}
        VITE_PORTAL_URL: ${PORTAL_URL:-https://deepbraintechnology.com}
    ports:
      - "127.0.0.1:${CHESSMATER_WEB_PORT:-8080}:8080"
    restart: unless-stopped
    depends_on:
      game-api:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  game-data:
